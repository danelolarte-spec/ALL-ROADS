version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: allroads-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: allroads
      POSTGRES_PASSWORD: allroads
      POSTGRES_DB: allroads
    ports:
      - '5432:5432'
    volumes:
      - allroads_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U allroads -d allroads']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  allroads_db:
