<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" width="400" height="460">
  <!-- ============ ICONO ============ -->
  <g transform="translate(200, 170)">
    <!-- Hoja verde superior -->
    <path d="M -45 -110 C -85 -100, -95 -55, -55 -25 C -25 -45, -10 -85, -45 -110 Z"
          fill="none" stroke="#4d9d5d" stroke-width="7" stroke-linejoin="round"/>
    <!-- Vena central de la hoja -->
    <path d="M -45 -110 C -40 -75, -45 -45, -55 -25"
          fill="none" stroke="#4d9d5d" stroke-width="5" stroke-linecap="round"/>

    <!-- Cacao (mazorca) marrón -->
    <path d="M 25 -90 C 90 -75, 100 25, 50 75 C 5 30, 0 -50, 25 -90 Z"
          fill="none" stroke="#7a4f2a" stroke-width="7" stroke-linejoin="round"/>
    <!-- Vena central de la mazorca -->
    <path d="M 25 -90 C 35 -30, 40 25, 50 75"
          fill="none" stroke="#7a4f2a" stroke-width="5" stroke-linecap="round"/>

    <!-- Semillas dentro de la mazorca -->
    <ellipse cx="50" cy="-45" rx="6" ry="9" fill="#7a4f2a"/>
    <ellipse cx="55" cy="-22" rx="6" ry="9" fill="#7a4f2a"/>
    <ellipse cx="58" cy="2"   rx="6" ry="9" fill="#7a4f2a"/>
    <ellipse cx="58" cy="26"  rx="6" ry="9" fill="#7a4f2a"/>
    <ellipse cx="52" cy="48"  rx="6" ry="9" fill="#7a4f2a"/>

    <!-- Gráfico de barras dentro de la hoja -->
    <rect x="-50" y="-20" width="14" height="40"  fill="#4d9d5d" rx="2"/>
    <rect x="-30" y="-40" width="14" height="60"  fill="#4d9d5d" rx="2"/>
    <rect x="-10" y="-10" width="14" height="30"  fill="#4d9d5d" rx="2"/>

    <!-- Línea de conexión / red de datos -->
    <path d="M -65 35 Q -25 75, 25 50 T 65 75"
          fill="none" stroke="#4d9d5d" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-65" cy="35" r="6" fill="#fff" stroke="#4d9d5d" stroke-width="3"/>
    <circle cx="-15" cy="65" r="6" fill="#fff" stroke="#4d9d5d" stroke-width="3"/>
    <circle cx="65"  cy="75" r="6" fill="#fff" stroke="#4d9d5d" stroke-width="3"/>
  </g>

  <!-- ============ TEXTO smart ============ -->
  <text x="200" y="340" text-anchor="middle"
        font-family="'Inter', 'Segoe UI', sans-serif"
        font-size="58" font-weight="300"
        fill="#6bb377" letter-spacing="2">smart</text>

  <!-- ============ TEXTO Cacao ============ -->
  <text x="200" y="425" text-anchor="middle"
        font-family="'Inter', 'Segoe UI', sans-serif"
        font-size="84" font-weight="600"
        fill="#7a4f2a" letter-spacing="1">Cacao</text>
</svg>
